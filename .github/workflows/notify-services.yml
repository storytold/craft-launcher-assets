name: Notify Services on Launcher Assets Change

on:
  push:
    branches: [main]
    tags: ['v*']

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit
      - name: Dispatch launcher assets change to artcraft-services
        env:
          DISPATCH_TOKEN: ${{ secrets.ARTCRAFT_SERVICES_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DISPATCH_TOKEN:-}" ]; then
            echo "::warning::ARTCRAFT_SERVICES_DISPATCH_TOKEN is not configured; skipping dispatch."
            exit 0
          fi
          jq -n \
            --arg ref "$GITHUB_REF" \
            --arg sha "$GITHUB_SHA" \
            '{event_type: "launcher-assets-changed", client_payload: {repo: "storytold/craft-launcher-assets", ref: $ref, sha: $sha}}' |
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/storytold/artcraft-services/dispatches" \
            --data-binary @-
